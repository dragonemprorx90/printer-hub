# Printer Hub home bridge. On a UGREEN NAS: Docker → Project → Create,
# paste this, change PRINTER_HOST (and the camera address) if needed, and deploy.
# The pairing code and alert topic appear in the container log on first start.
# One bridge per printer: copy the bridge service with its own ./data folder.
services:
  printer-hub-bridge:
    image: ghcr.io/dragonemprorx90/printer-hub-bridge:latest
    restart: unless-stopped
    network_mode: host       # so it can reach the printer on your LAN
    environment:
      RELAY_URL: https://printer-hub-relay.printer-hub-relay.workers.dev
      PRINTER_HOST: 192.168.68.53
      # Camera from away (read only while a phone watches). For an MJPEG
      # camera use its stream, e.g. http://<printer ip>/webcam/stream.mjpg?fps=3
      CAMERA_URL: http://127.0.0.1:1984/api/stream.mjpeg?src=k2_jpeg
    volumes:
      - ./data:/data         # keeps the pairing across restarts

  # Turns a Creality K1/K2 WebRTC-only camera into MJPEG for the bridge. It
  # connects to the camera only while a phone away from home is watching.
  # Not needed for MJPEG cameras. (fps=3 is in the K2's own clock, which
  # runs fast: about 30 fps come out; the bridge sends only a few.)
  go2rtc:
    image: alexxit/go2rtc:1.9.15
    restart: unless-stopped
    network_mode: host
    command: >-
      go2rtc -c '{api: {listen: "127.0.0.1:1984"}, rtsp: {listen: "127.0.0.1:8554"},
      webrtc: {listen: ""}, streams: {k2: "webrtc:http://192.168.68.53:8000/call/webrtc_local#format=creality",
      k2_jpeg: "ffmpeg:k2#video=mjpeg#raw=-vf fps=3,scale=1280:-2 -q:v 5"}}'
