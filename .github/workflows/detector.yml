# Failure detector image for the home bridge (spaghetti detection), Intel and ARM:
#   ghcr.io/<owner>/printer-hub-detector:latest
# Every change to detector/ is built and tested (sample failure and OK frames
# through the real model); tags also publish it.
name: Detector image

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']          # path filters don't apply to tags
    paths: ['detector/**', '.github/workflows/detector.yml']

permissions:
  contents: read
  packages: write

jobs:
  detector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          echo "VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build (amd64) and test
        uses: docker/build-push-action@v6
        with:
          context: detector
          load: true
          tags: printer-hub-detector:test
      - run: docker run --rm --entrypoint python3 printer-hub-detector:test /app/test_server.py

      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: startsWith(github.ref, 'refs/tags/')
        with:
          context: detector
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/printer-hub-detector:latest
            ghcr.io/${{ github.repository_owner }}/printer-hub-detector:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Printer Hub failure detector (Obico model) for the home bridge
            org.opencontainers.image.licenses=AGPL-3.0
