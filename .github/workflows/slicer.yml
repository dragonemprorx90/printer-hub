# Slicer image for the home bridge (OrcaSlicer CLI), Intel and ARM:
#   ghcr.io/<owner>/printer-hub-slicer:latest
# Every change to slicer/ is built and tested (a real slice of a cube for
# both printers, plus a STEP file); tags also publish it.
name: Slicer image

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']          # path filters don't apply to tags
    paths: ['slicer/**', '.github/workflows/slicer.yml']

permissions:
  contents: read
  packages: write

jobs:
  slicer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          echo "VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build (amd64) and test
        uses: docker/build-push-action@v6
        with:
          context: slicer
          load: true
          tags: printer-hub-slicer:test
      - run: docker run --rm --entrypoint python3 printer-hub-slicer:test /app/test_server.py

      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: startsWith(github.ref, 'refs/tags/')
        with:
          context: slicer
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/printer-hub-slicer:latest
            ghcr.io/${{ github.repository_owner }}/printer-hub-slicer:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Printer Hub slicer: OrcaSlicer for the home bridge
            org.opencontainers.image.licenses=AGPL-3.0
