# Builds everything on a GitHub-hosted Mac and, for a tag like v1.1.0,
# publishes a release that the app's "Check for updates" finds:
#   - iPhone IPA (unsigned: install with SideStore/AltStore, which sign it
#     with your Apple ID)
#   - Mac app
#   - home bridge for Linux x64 / arm64 (NAS, Raspberry Pi) and macOS
#   - relay source for Cloudflare Workers
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Version
        run: |
          echo "VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_ENV"

      - name: Tests
        run: |
          flutter pub get
          flutter test
          (cd packages/hub_link && dart pub get && dart test)
          (cd bridge && dart pub get && dart analyze --fatal-infos)

      - name: iPhone IPA (unsigned)
        run: |
          flutter build ios --release --no-codesign
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          (cd dist && zip -qry "PrinterHub-$VERSION.ipa" Payload && rm -rf Payload)

      - name: Mac app (DMG)
        run: |
          flutter build macos --release
          mkdir -p dmg
          cp -R "build/macos/Build/Products/Release/Printer Hub.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Printer Hub" -srcfolder dmg -ov -format UDZO \
            "dist/PrinterHub-$VERSION.dmg"

      - name: Home bridge
        run: |
          cd bridge
          for arch in x64 arm64; do
            dart compile exe -DVERSION="$VERSION" --target-os linux --target-arch "$arch" bin/bridge.dart \
              -o "../dist/printer-hub-bridge-$VERSION-linux-$arch"
          done
          dart compile exe -DVERSION="$VERSION" bin/bridge.dart -o "../dist/printer-hub-bridge-$VERSION-macos-arm64"

      - name: Relay source
        run: tar -czf "dist/printer-hub-relay-$VERSION.tar.gz" --exclude node_modules --exclude .wrangler relay

      - uses: actions/upload-artifact@v4
        with:
          name: printer-hub-${{ env.VERSION }}
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # Ready-to-run bridge image for NAS / Raspberry Pi (Intel and ARM):
  #   ghcr.io/<owner>/printer-hub-bridge:latest
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Version
        run: |
          echo "VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_ENV"

      - name: Compile bridge for amd64 and arm64
        run: |
          cd bridge
          dart pub get
          mkdir -p build
          for arch in amd64 arm64; do
            dart_arch=$([ "$arch" = amd64 ] && echo x64 || echo arm64)
            dart compile exe -DVERSION="$VERSION" --target-os linux --target-arch "$dart_arch" bin/bridge.dart \
              -o "build/printer-hub-bridge-linux-$arch"
          done

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: bridge
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/printer-hub-bridge:latest
            ghcr.io/${{ github.repository_owner }}/printer-hub-bridge:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Printer Hub home bridge: reach your printer from anywhere
            org.opencontainers.image.licenses=NOASSERTION
