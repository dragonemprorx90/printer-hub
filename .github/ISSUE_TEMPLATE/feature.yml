name: Feature idea
description: Something you'd like Printer Hub to do
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes: {label: What would you like, description: The problem first, then the idea.}
    validations: {required: true}
  - type: input
    id: printer
    attributes: {label: Printer, placeholder: "e.g. Creality K2 Plus"}
